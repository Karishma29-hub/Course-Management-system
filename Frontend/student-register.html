<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Registration</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            color: #243b64;

            background:
                radial-gradient(circle at 5% 15%, #d9ebff 0, #d9ebff 90px, transparent 91px),
                radial-gradient(circle at 95% 85%, #dcecff 0, #dcecff 130px, transparent 131px),
                linear-gradient(135deg, #f4faff, #e5f2ff);
        }

        /* Navigation */

        nav {
            background: rgba(255, 255, 255, 0.96);

            padding: 18px 8%;

            display: flex;
            justify-content: space-between;
            align-items: center;

            box-shadow: 0 2px 12px rgba(60, 100, 150, 0.08);
        }

        nav h2 {
            color: #243b64;
            font-size: 23px;
        }

        nav ul {
            list-style: none;

            display: flex;
            align-items: center;

            gap: 32px;
        }

        nav ul li a {
            color: #344b70;

            text-decoration: none;

            font-weight: 600;

            transition: 0.3s;
        }

        nav ul li a:hover {
            color: #527de8;
        }

        .active {
            color: #527de8 !important;

            background: #edf3ff;

            padding: 10px 18px;

            border-radius: 20px;
        }

        /* Registration Area */

        .register-page {
            min-height: calc(100vh - 75px);

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 45px 20px;
        }

        /* Card */

        .register-card {
            width: 100%;

            max-width: 550px;

            background: rgba(255, 255, 255, 0.96);

            padding: 40px 50px;

            border-radius: 22px;

            box-shadow:
                0 15px 40px rgba(70, 110, 160, 0.13);

            text-align: center;
        }

        .register-icon {
            width: 70px;
            height: 70px;

            margin: 0 auto 18px;

            border-radius: 50%;

            background: #f1efff;

            color: #7565d5;

            display: flex;

            justify-content: center;

            align-items: center;

            font-size: 30px;
        }

        .register-card h1 {
            color: #263f6d;

            font-size: 34px;

            margin-bottom: 10px;
        }

        .register-description {
            color: #71809a;

            line-height: 1.6;

            margin-bottom: 25px;
        }

        /* Form */

        .form-group {
            text-align: left;

            margin-bottom: 17px;
        }

        .form-group label {
            display: block;

            color: #344b70;

            font-weight: 600;

            margin-bottom: 7px;
        }

        .input-box {
            width: 100%;

            padding: 13px 15px;

            border: 1px solid #d3e0f5;

            border-radius: 10px;

            font-size: 15px;

            color: #344b70;

            background: #fbfdff;

            outline: none;

            transition: 0.3s;
        }

        .input-box:focus {
            border-color: #8caaf0;

            box-shadow:
                0 0 0 3px rgba(140, 170, 240, 0.15);

            background: white;
        }

        .input-box::placeholder {
            color: #9aaac1;
        }

        /* Register Button */

        .register-btn {
            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 10px;

            background: #e7e2ff;

            color: #6656c5;

            font-size: 16px;

            font-weight: 700;

            cursor: pointer;

            transition: 0.3s;

            margin-top: 5px;
        }

        .register-btn:hover {
            background: #dcd5ff;

            transform: translateY(-2px);
        }

        /* Login Link */

        .login-text {
            margin-top: 20px;

            color: #71809a;

            font-size: 15px;
        }

        .login-text a {
            color: #527de8;

            text-decoration: none;

            font-weight: 700;
        }

        .login-text a:hover {
            text-decoration: underline;
        }

        /* Mobile */

        @media (max-width: 700px) {

            nav {
                flex-direction: column;
                gap: 15px;
                padding: 20px;
            }

            nav ul {
                gap: 15px;
                flex-wrap: wrap;
                justify-content: center;
            }

            .register-page {
                padding: 30px 15px;
            }

            .register-card {
                padding: 35px 25px;
            }

            .register-card h1 {
                font-size: 28px;
            }
        }

    </style>
</head>

<body>

    <!-- Navigation -->

    <nav>

        <h2>🎓 Student Management System</h2>

        <ul>

            <li>
                <a href="index.html">Home</a>
            </li>

            <li>
                <a href="student-login.html">Login</a>
            </li>

            <li>
                <a href="student-register.html" class="active">
                    Register
                </a>
            </li>

            <li>
                <a href="student-dashboard.html">
                    Dashboard
                </a>
            </li>

        </ul>

    </nav>


    <!-- Registration -->

    <main class="register-page">

        <div class="register-card">

            <div class="register-icon">
                👤+
            </div>

            <h1>
                Student Registration
            </h1>

            <p class="register-description">
                Create your student account by entering
                your details below.
            </p>


            <form
                onsubmit="handleRegistration(event)"
            >

                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        class="input-box"
                        placeholder="Enter your name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        class="input-box"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        class="input-box"
                        placeholder="Create a password"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        class="input-box"
                        placeholder="Confirm your password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="register-btn"
                >
                    Create Account &nbsp; →
                </button>

            </form>


            <p class="login-text">

                Already have an account?

                <a href="student-login.html">
                    Login Here
                </a>

            </p>

        </div>

    </main>


    <script>

        function handleRegistration(event) {

            event.preventDefault();

            let password =
                document.getElementById("password").value;

            let confirmPassword =
                document.getElementById("confirmPassword").value;

            if (password !== confirmPassword) {

                alert("Passwords do not match!");

                return;
            }

            alert("Registration successful!");

            window.location.href =
                "student-login.html";
        }

    </script>

</body>

</html>
